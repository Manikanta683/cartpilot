<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DemoKart — shop with CartPilot</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7fb; }
  header { background: #0f2540; color: #fff; padding: 18px 24px; }
  header h1 { margin: 0; font-size: 20px; }
  main { padding: 24px; max-width: 900px; margin: auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .card h3 { margin: 0 0 6px; font-size: 15px; }
  .card p { margin: 0 0 8px; color: #555; font-size: 13px; }
  .price { font-weight: 700; }
  #chatfab { position: fixed; right: 24px; bottom: 24px; width: 60px; height: 60px;
             border-radius: 50%; border: none; background: #3395ff; color: #fff;
             font-size: 26px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  #chatpanel { position: fixed; right: 24px; bottom: 100px; width: 340px; height: 440px;
               background: #fff; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.2);
               display: none; flex-direction: column; overflow: hidden; }
  #chatpanel.open { display: flex; }
  #chathead { background: #0f2540; color: #fff; padding: 12px 16px; font-weight: 600; }
  #chatlog { flex: 1; overflow-y: auto; padding: 12px; font-size: 14px; }
  .msg { margin: 8px 0; padding: 8px 12px; border-radius: 10px; max-width: 85%; white-space: pre-wrap; }
  .user { background: #e3f0ff; margin-left: auto; }
  .bot { background: #f1f2f6; }
  #chatform { display: flex; border-top: 1px solid #eee; }
  #chatinput { flex: 1; border: none; padding: 12px; font-size: 14px; outline: none; }
  #chatform button { border: none; background: #3395ff; color: #fff; padding: 0 18px; cursor: pointer; }
</style>
</head>
<body>
<header><h1>DemoKart</h1><p style="margin:4px 0 0;font-size:13px;opacity:.8">A demo store powered by CartPilot</p></header>
<main>
  <h2>Today's picks</h2>
  <div class="grid" id="grid"></div>
</main>
<button id="chatfab" title="Chat with CartPilot">💬</button>
<div id="chatpanel">
  <div id="chathead">CartPilot — shopping assistant</div>
  <div id="chatlog"></div>
  <form id="chatform"><input id="chatinput" placeholder="Ask for a gift, a deal…" autocomplete="off"><button>Send</button></form>
</div>
<script src="chat.js"></script>
</body>
</html>
